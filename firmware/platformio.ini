; Marvin firmware. Build and flash with PlatformIO:
;   pio run -e d1_mini -t upload && pio device monitor -e d1_mini
; Copy include/secrets.example.h to include/secrets.h first and put your Wi-Fi in it.
; SPDX-License-Identifier: MIT

[platformio]
default_envs = d1_mini

[env]
monitor_speed = 115200
build_flags =
    -DMARVIN_FW_VERSION=\"0.1.0\"
    -DMARVIN_SIM_LIDAR_MODEL=1      ; simulated lidar: 1 = D500 (4500 pts/s), 2 = D800 (21600 pts/s)

; Prototype board: Wemos D1 mini (ESP8266). Simulated sensors only.
[env:d1_mini]
framework = arduino
platform = platformio/espressif8266@4.2.1
board = d1_mini
board_build.f_cpu = 160000000L
upload_speed = 460800
; 74880 baud: the ESP8266 boot ROM prints at this speed, so boot messages and ours are both readable
monitor_speed = 74880
monitor_filters = esp8266_exception_decoder
build_flags =
    ${env.build_flags}
    -DMARVIN_HAS_OTA                ; wireless updates (src/ota.h, docs/tools.md)
    -DMARVIN_BOARD=1
    -DMARVIN_SERIAL_BAUD=74880
    -DMARVIN_LED_ACTIVE_LOW=1

; The bench parts (MARVIN_HAS_BENCH_IO, src/bench/bench_io.h, docs/wiring-bench.md): an SSD1306 OLED
; with the eyes, Talk and Mute buttons, a passive buzzer. Only the bench envs build U8g2.
[bench_io]
lib_deps =
    olikraus/U8g2@2.36.18

; ESP32-S3 DevKitC-1 (bench board). Simulated sensors, and the bench parts on its own pins.
[env:esp32s3]
framework = arduino
platform = platformio/espressif32@7.1.3   ; Arduino-ESP32 2.0.x, pinned
board = esp32-s3-devkitc-1
monitor_rts = 0                  ; the native USB port: an asserted RTS/DTR holds the chip in reset
monitor_dtr = 0
lib_deps = ${bench_io.lib_deps}
build_flags =
    ${env.build_flags}
    -DMARVIN_HAS_OTA                ; wireless updates (src/ota.h, docs/tools.md)
    -DMARVIN_BOARD=2
    -DARDUINO_USB_CDC_ON_BOOT=1     ; logs on the native USB port, the same one that flashes (USB-Serial/JTAG)
    -DMARVIN_HAS_SCREEN             ; the face on the ST7789 (src/face/face_app.h)
    -DMARVIN_HAS_BENCH_IO           ; OLED eyes (I2C, not the ST7789's SPI), buttons, buzzer, RGB status LED
    -DMARVIN_OLED_SDA=17
    -DMARVIN_OLED_SCL=18
    -DMARVIN_BUTTON_TALK=11
    -DMARVIN_BUTTON_MUTE=12
    -DMARVIN_BUZZER_PIN=13
    -DMARVIN_STATUS_RGB=48          ; the RGB LED's data pin: GPIO48 on v1.0 boards...
    -DMARVIN_STATUS_RGB_ALT=38      ; ...GPIO38 on v1.1; both are driven (-1 to free one)
    -DMARVIN_HAS_ROOM_SENSORS       ; PIR, DHT11, light sensor: ENVIRONMENT (src/room/room_io.h)
    -DMARVIN_PIR_PIN=14
    -DMARVIN_DHT11_PIN=15
    -DMARVIN_LDR_PIN=5              ; ADC1_CH4
;   -DMARVIN_HAS_LDR                ; enable once the LDR module is wired

; Classic ESP32 DevKit (ESP32-WROOM-32, 30 pins, micro-USB with a CP2102 or CH340 bridge). Simulated
; sensors and the bench parts: a second device on the bench.
; Flash with: pio run -e esp32dev -t upload && pio device monitor -e esp32dev
[env:esp32dev]
framework = arduino
platform = platformio/espressif32@7.1.3   ; Arduino-ESP32 2.0.x, pinned
board = esp32dev
upload_speed = 460800             ; 921600 drops out mid-write on some CP2102 / CH340 boards
lib_deps = ${bench_io.lib_deps}
build_flags =
    ${env.build_flags}
    -DMARVIN_HAS_OTA                ; wireless updates (src/ota.h, docs/tools.md)
    -DMARVIN_BOARD=5
    -DLED_BUILTIN=2                 ; the blue LED of most DevKit V1 boards: the status LED
    -DMARVIN_HAS_BENCH_IO           ; OLED eyes, buttons, buzzer (docs/wiring-bench.md)
    -DMARVIN_OLED_SDA=21
    -DMARVIN_OLED_SCL=22
    -DMARVIN_BUTTON_TALK=32
    -DMARVIN_BUTTON_MUTE=33         ; not fitted yet: the pull-up keeps it released
    -DMARVIN_BUZZER_PIN=25
    -DMARVIN_HAS_ROOM_SENSORS       ; PIR, DHT11, light sensor: ENVIRONMENT (docs/wiring-bench.md)
    -DMARVIN_PIR_PIN=34             ; HC-SR501 OUT (3.3 V), input only, no pull: the PIR drives it
    -DMARVIN_DHT11_PIN=4
    -DMARVIN_LDR_PIN=35             ; ADC1_CH7
;   -DMARVIN_HAS_LDR                ; enable once the LDR module is wired

; The robot: Seeed XIAO ESP32S3 Sense, reading its real lidar (UART0) and LD2450 (UART1).
; Board default partitions (default_8MB.csv): two 3.2 MB OTA app slots, so OTA keeps working.
[env:xiao_esp32s3]
framework = arduino
platform = platformio/espressif32@7.1.3   ; Arduino-ESP32 2.0.x, pinned
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DMARVIN_HAS_OTA                ; wireless updates (src/ota.h, docs/tools.md)
    -DMARVIN_BOARD=3
    -DMARVIN_LED_ACTIVE_LOW=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMARVIN_SENSORS=REAL
    -DMARVIN_HAS_SCREEN
    -DMARVIN_HAS_AUDIO              ; speaker (I2S1) + PDM mic (I2S0) over UDP (src/audio/audio_app.h)
    -DMARVIN_HAS_CAMERA             ; MJPEG on http://<ip>:81/stream (src/camera/camera_app.h)
    -DMARVIN_LIDAR_MODEL=2          ; 1 = D500 (230400 baud), 2 = D800 (921600 baud)

; The same board with simulated sensors, e.g. before the sensors are wired.
[env:xiao_esp32s3_sim]
framework = arduino
platform = platformio/espressif32@7.1.3   ; Arduino-ESP32 2.0.x, pinned
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DMARVIN_HAS_OTA                ; wireless updates (src/ota.h, docs/tools.md)
    -DMARVIN_BOARD=3
    -DMARVIN_LED_ACTIVE_LOW=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMARVIN_SENSORS=SIM
    -DMARVIN_HAS_SCREEN
    -DMARVIN_HAS_AUDIO
    -DMARVIN_HAS_CAMERA

; Host-side unit tests of the portable code (parsers, face renderer): `pio test -e native`.
; Only files that do not need Arduino are built here; main.cpp is excluded.
; The robot, flashed over Wi-Fi once a first USB upload has put an OTA-capable firmware on it:
;   pio run -e xiao_esp32s3_ota -t upload --upload-port marvin-a1b2c3.local   (or its IP)
; The password is OTA_PASSWORD from include/secrets.h, read by scripts/ota_auth.py: nothing to export.
[env:xiao_esp32s3_ota]
extends = env:xiao_esp32s3
upload_protocol = espota
upload_port = marvin-xxxxxx.local   ; your robot's name (printed by marvin-host) or its IP
upload_flags =
    --port=3232
extra_scripts = post:scripts/ota_auth.py

; The D1 mini over Wi-Fi, the same way:
;   pio run -e d1_mini_ota -t upload --upload-port marvin-526c5e.local   (or its IP)
[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = marvin-xxxxxx.local
upload_flags =
    --port=8266
extra_scripts = post:scripts/ota_auth.py

; The classic ESP32 DevKit over Wi-Fi:
;   pio run -e esp32dev_ota -t upload --upload-port marvin-xxxxxx.local   (or its IP)
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = marvin-xxxxxx.local
upload_flags =
    --port=3232
extra_scripts = post:scripts/ota_auth.py

; The "looks" bench (docs/looks-bench.md): the same classic ESP32 DevKit with a real LD2450 (no
; lidar), a 9 g servo turning the head towards the nearest person, the OLED eyes, a Talk button and
; the buzzer. Its own env, so esp32dev keeps the simulated bench.
;   pio run -e esp32dev_looks -t upload --upload-port /dev/cu.usbserial-XXXX
[env:esp32dev_looks]
framework = arduino
platform = platformio/espressif32@7.1.3   ; Arduino-ESP32 2.0.x, pinned
board = esp32dev
upload_speed = 460800             ; 921600 drops out mid-write on some CP2102 / CH340 boards
lib_deps = ${bench_io.lib_deps}
build_flags =
    ${env.build_flags}
    -DMARVIN_HAS_OTA                ; wireless updates (src/ota.h, docs/tools.md)
    -DMARVIN_BOARD=5
    -DLED_BUILTIN=2                 ; the blue LED of most DevKit V1 boards: the status LED
    -DMARVIN_SENSORS=REAL
    -DMARVIN_LIDAR_MODEL=0          ; no lidar: the LD2450 only (UART1, RX GPIO26, TX GPIO27)
    -DMARVIN_HAS_BENCH_IO           ; OLED eyes, Talk button, buzzer
    -DMARVIN_OLED_SDA=21            ; optional: the eyes start whenever an SSD1306 answers at 0x3C / 0x3D
    -DMARVIN_OLED_SCL=22
    -DMARVIN_BUTTON_TALK=32
    -DMARVIN_BUTTON_MUTE=-1         ; no Mute button on this bench
    -DMARVIN_BUZZER_PIN=25
    -DMARVIN_HAS_HEAD               ; the servo head: follows the nearest LD2450 target (src/head/head_io.h)
    -DMARVIN_HEAD_PIN=13
    -DMARVIN_HEAD_MIN_US=500        ; the servo's pulse range for 0..180 degrees
    -DMARVIN_HEAD_MAX_US=2500
    -DMARVIN_HEAD_MIN_DEG=20        ; travel limits around the centre (90)
    -DMARVIN_HEAD_MAX_DEG=160
    -DMARVIN_HEAD_MIRROR=0          ; 1 if the head turns away from people
    -DMARVIN_PRESENCE_CHIRPS=1      ; "hello" / "bye" on the buzzer when someone arrives or leaves (0: mute)
;   -DMARVIN_STATUS_RGB=18          ; a WS2812 strip's data pin: its first LED shows the link status
;   -DMARVIN_STATUS_RGB_ALT=-1      ; (instead of the blue LED); off by default

; The "looks" bench over Wi-Fi:
;   pio run -e esp32dev_looks_ota -t upload --upload-port marvin-xxxxxx.local   (or its IP)
[env:esp32dev_looks_ota]
extends = env:esp32dev_looks
upload_protocol = espota
upload_port = marvin-xxxxxx.local
upload_flags =
    --port=3232
extra_scripts = post:scripts/ota_auth.py

[env:native]
platform = native
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
build_flags = -std=gnu++17 -Wall -Wextra
