; Marvin firmware. Build and flash with PlatformIO:
;   pio run -e d1_mini -t upload && pio device monitor -e d1_mini
; Copy include/secrets.example.h to include/secrets.h first and put your Wi-Fi in it.
; SPDX-License-Identifier: MIT

[platformio]
default_envs = d1_mini

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -DMARVIN_FW_VERSION=\"0.1.0\"
    -DMARVIN_SIM_LIDAR_MODEL=1      ; 1 = D500 (4500 pts/s), 2 = D800 (21600 pts/s)

; Prototype board: Wemos D1 mini (ESP8266). Simulated sensors only.
[env:d1_mini]
platform = espressif8266
board = d1_mini
board_build.f_cpu = 160000000L
upload_speed = 921600
monitor_filters = esp8266_exception_decoder
build_flags =
    ${env.build_flags}
    -DMARVIN_BOARD=1
    -DMARVIN_LED_ACTIVE_LOW=1

; ESP32-S3 DevKitC-1 (bench board).
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DMARVIN_BOARD=2
    -DARDUINO_USB_CDC_ON_BOOT=1

; The robot: Seeed XIAO ESP32S3 Sense.
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DMARVIN_BOARD=3
    -DMARVIN_LED_ACTIVE_LOW=1
    -DARDUINO_USB_CDC_ON_BOOT=1
