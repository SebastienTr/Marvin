; Marvin MR60BHA2 bridge: firmware for the XIAO ESP32C6 of Seeed's MR60BHA2 kit.
; Reads the radar and sends its vital signs to the Marvin host (protocol v1, board id 4).
;   pio run -t upload && pio device monitor
; Copy include/secrets.example.h to include/secrets.h first and put your Wi-Fi in it.
; SPDX-License-Identifier: MIT

[platformio]
default_envs = xiao_esp32c6
; pioarduino registers itself as "espressif32" too: keep it and its Arduino 3.x packages in their
; own PlatformIO core (the main firmware pins espressif32@7.1.3 as well, belt and braces).
core_dir = ~/.platformio-pioarduino

[env]
monitor_speed = 115200
build_flags =
    -DMARVIN_FW_VERSION=\"mr60-bridge-0.2.0\"
    -DMARVIN_BOARD=4
    -I../src                      ; shared protocol.h of the main firmware

; Seeed XIAO ESP32C6 on the MR60BHA2 kit.
; The official platformio/espressif32 platform only offers ESP-IDF for the ESP32-C6; Arduino on the C6
; needs Arduino-ESP32 3.x, which the community pioarduino platform packages. Pinned to a release.
[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32c6
build_flags =
    ${env.build_flags}
    -Wall
    -DMARVIN_HAS_OTA              ; wireless updates (../src/ota.h, ota_shared.cpp); OTA_PASSWORD in secrets.h

; The kit flashed over Wi-Fi, once a first USB upload has put this firmware on it:
;   pio run -e xiao_esp32c6_ota -t upload --upload-port marvin-xxxxxx.local   (its "OTA: ready as" line, or its IP)
; The password is OTA_PASSWORD from include/secrets.h, read by the main firmware's scripts/ota_auth.py.
[env:xiao_esp32c6_ota]
extends = env:xiao_esp32c6
upload_protocol = espota
upload_port = marvin-xxxxxx.local
upload_flags =
    --port=3232
extra_scripts = post:../scripts/ota_auth.py

; Host-side unit tests of the portable radar parser and VITALS encoder: `pio test -e native`.
[env:native]
platform = native
test_build_src = no
build_flags =
    ${env.build_flags}
    -std=gnu++17 -Wall -Wextra
