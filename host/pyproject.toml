[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marvin-host"
version = "0.1.0"
description = "Desktop side of the Marvin desk robot: receivers, simulator and live viewer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "rerun-sdk>=0.23"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# talk to Marvin, all local (docs/voice.md); Piper voices are optional: pip install piper-tts
voice = ["sounddevice>=0.5", "faster-whisper>=1.1", "webrtcvad-wheels>=2.0.14"]

[project.scripts]
marvin-host = "marvin_host.cli:main"

[tool.setuptools.packages.find]
include = ["marvin_host*"]

[tool.setuptools.package-data]
"marvin_host.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
