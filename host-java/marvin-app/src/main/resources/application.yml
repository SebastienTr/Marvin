# SPDX-License-Identifier: MIT
# Marvin's host. Every value can be set from the environment (./marvin sets the MARVIN_* ones).
server:
  port: ${MARVIN_PORT:8765}
  address: ${MARVIN_BIND:0.0.0.0}
  shutdown: graceful

spring:
  application:
    name: marvin-host
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  web:
    resources:
      # the app's files are served by the web adapter, with the Python host's headers
      add-mappings: false
  datasource:
    url: ${MARVIN_DB_URL:jdbc:postgresql://127.0.0.1:5433/marvin}
    username: ${MARVIN_DB_USER:marvin}
    password: ${MARVIN_DB_PASSWORD:marvin}
    hikari:
      maximum-pool-size: 8
      # a local database: fail fast rather than hang when it is gone
      connection-timeout: 5000

marvin:
  # live: wait for the real robot; demo: a simulated robot and a simulated past week
  mode: ${MARVIN_MODE:live}
  data-dir: ${MARVIN_DATA_DIR:${user.home}/.local/share/marvin}
  # the owner's time zone for days and quiet hours; empty: this computer's
  time-zone: ${MARVIN_TZ:}
  web:
    # access key for other devices: auto (kept in <data-dir>/ui_token, shared with the Python host), off, or a key
    token: ${MARVIN_UI_TOKEN:auto}
    data-dir: ${marvin.data-dir}
  # where voice.json is (the voice's settings, shared with the Python host); empty: $MARVIN_CONFIG_DIR,
  # $XDG_CONFIG_HOME/marvin or ~/.config/marvin
  config-dir: ${MARVIN_CONFIG_DIR:}
  history:
    # no new brain state for this long: the robot is offline
    offline-after-s: 15
  import:
    # the Python host's history, imported once on first start (empty: none)
    sqlite: ${MARVIN_IMPORT:${marvin.data-dir}/marvin.db}
  sidecar:
    # the Python for the sidecars (./marvin passes host/.venv); empty: host/.venv, then python3
    python: ${MARVIN_PYTHON:}
    repo: ${MARVIN_REPO:}
    # demo mode: the Python simulator as the robot, and a simulated past week
    simulator: ${MARVIN_DEMO_SIMULATOR:true}
    seed: ${MARVIN_DEMO_SEED:true}
    # the voice sidecar (python -m marvin_host.sidecar.voice), started with the host
    voice: ${MARVIN_VOICE_SIDECAR:true}
    # more arguments for it, e.g. its test mode: --fake,--say,2:Marvin bonjour
    voice-args: ${MARVIN_VOICE_ARGS:}
  memory:
    # the embedding size memory's tables are made with (1024: qwen3-embedding:8b is asked for its first 1024 components); fixed once created
    embedding-dimensions: ${MARVIN_EMBEDDING_DIMENSIONS:1024}
    # auto: pgvector's HNSW index when installed; off: exact search (what the embedded PostgreSQL does anyway)
    vector: ${MARVIN_MEMORY_VECTOR:auto}
    # the memory worker (idle and nightly passes); its models and hours are the owner's memory settings
    worker: ${MARVIN_MEMORY_WORKER:true}
    tick-s: 30
  db:
    # external: the PostgreSQL at spring.datasource.url (Docker); embedded: started by the host
    mode: ${MARVIN_DB_MODE:external}
    embedded:
      data-directory: ${marvin.data-dir}/pg
      port: ${MARVIN_EMBEDDED_DB_PORT:5434}
  robot:
    # the robot link, UDP protocol v1 (docs/protocol.md): only one host may own the port
    enabled: ${MARVIN_ROBOT:true}
    bind: ${MARVIN_UDP_BIND:0.0.0.0}
    port: ${MARVIN_UDP_PORT:47100}
    # forward every datagram to the Python viewer (marvin-host run --port 47110 --no-ui), e.g. 47110
    tap: ${MARVIN_TAP:}
    # record the datagrams to a .mvrec(.gz) file, as marvin-host run --record does
    record: ${MARVIN_RECORD:}
    # play a recording instead of listening for robots
    replay: ${MARVIN_REPLAY:}
    replay-speed: ${MARVIN_REPLAY_SPEED:1.0}
    replay-loop: ${MARVIN_REPLAY_LOOP:true}
    face-state-hz: 10
    # empty: $MARVIN_CONFIG_DIR, $XDG_CONFIG_HOME/marvin or ~/.config/marvin, calibration.json
    calibration-file: ${MARVIN_CALIBRATION:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # the components (database, robot, voice) by name; open to this computer only, as the whole API
      show-components: always
      group:
        # no traffic without the database; liveness stays free of external dependencies
        readiness:
          include: readinessState,db
  # a trace per question (design 10.4), exported only when an OTLP endpoint is set, e.g.
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: ${MARVIN_OTLP_METRICS:false}
  logging:
    export:
      otlp:
        enabled: false

logging:
  level:
    root: warn
    marvin.host: info
    # "extension vector already exists": a notice, not a warning for the owner
    org.flywaydb.core.internal.sqlscript: error
    org.springframework.boot.web.embedded: info
