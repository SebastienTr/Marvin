// SPDX-License-Identifier: MIT
//
// The contract between Marvin's Java core and the voice sidecar (docs/design.md, section 4).
//
// The sidecar owns the real-time audio loop: audio in and out, VAD and segmentation, the echo gate,
// the wake word and listening windows, speculative and final speech recognition with its filters,
// chunking text for speech, synthesis and playback pacing, barge-in. The core owns the
// conversation: what to answer and with which context, the model, the tools, memory, and the
// robot's UDP socket (it relays the robot's microphone to the sidecar and the sidecar's speaker
// frames to the robot).
//
// One long-lived bidirectional stream per session (Voice.Session). The core opens it, sends
// Configure first, and re-sends Configure whenever the settings change. Audio is always 16 kHz
// mono signed 16-bit little-endian PCM (docs/protocol.md, "Audio messages"). Times are seconds
// (double) unless the name says otherwise. Health: the standard grpc.health.v1.Health service,
// served by the sidecar next to this one.
//
// Compatibility: fields are only ever added. A breaking change is a new package (marvin.voice.v2).
syntax = "proto3";

package marvin.voice.v1;

option java_multiple_files = true;
option java_package = "marvin.host.contracts.voice.v1";
option java_outer_classname = "VoiceProto";

service Voice {
  // The live session: audio and commands in, what the voice hears and does out.
  rpc Session(stream CoreToVoice) returns (stream VoiceToCore);
  // Batch recognition, for recordings: not the live loop.
  rpc Transcribe(AudioClip) returns (Transcript);
  // What the settings can offer: backends, models, voices (the app's voice settings).
  rpc Options(OptionsRequest) returns (VoiceOptions);
}

// ============================================================================ core -> sidecar

message CoreToVoice {
  oneof m {
    Configure configure = 1;
    AudioFrame robot_mic = 2;       // a relayed AUDIO_IN, same samples
    ReplyStart reply_start = 3;     // an answer begins: text pieces follow
    TextPiece text = 4;             // a piece of the answer, as the model streams it
    ReplyEnd reply_end = 5;         // no more text for this answer
    Say say = 6;                    // speak a whole text now (reminders, welcome back, errors)
    ListenNow listen_now = 7;       // Talk now (or stop listening)
    Mute mute = 8;
    StopSpeaking stop = 9;
    Filler filler = 10;             // a short sentence while a tool runs ("Let me check.")
    RobotLink robot_link = 11;      // a robot with audio connected or left
    Ask ask = 12;                   // a typed question: answered like a heard one (Heard, source "typed")
    Earcon earcon = 13;             // play a short sound on the voice's device (the core decides when)
  }
}

// The voice's settings: the keys of voice.json that the sidecar uses (docs/voice.md).
//
// Contract version 2: the core is the single source of every value (host-java VoiceSettings). It sends
// each field with its actual value, defaults included, and chooses the audio device itself (`device`):
// the sidecar never fills a default in nor decides the route. A new Configure that only changes `device`
// swaps the microphone and the speaker under the running voice (no models are reloaded).
message Configure {
  uint32 contract_version = 1;                 // 2
  VoiceSettings settings = 2;
  AudioRoute route = 3;                        // the same choice as device.kind (kept for version 1 readers)
  AudioDeviceProfile device = 4;               // version 2: where the voice hears and speaks, and how
}

// One audio device: a microphone and a speaker that go together (the computer's, or one robot's), with what
// the voice needs to know to listen and speak on it without hearing itself.
message AudioDeviceProfile {
  string kind = 1;                  // computer | robot
  string robot = 2;                 // with robot: the robot's device name (RobotLink.device)
  bool duplex = 3;                  // keep listening while speaking (only with echo cancellation or a headset)
  double echo_tail_s = 4;           // half duplex: still deaf this long after the speaker really stopped
  double output_latency_s = 5;      // from queuing a sample to hearing it, added to the tail (0: the sink's own)
  double vad_min_dbfs = 6;          // a 20 ms frame quieter than this is never speech
  double speech_min_dbfs = 7;       // an utterance whose loudest half is quieter than this is "too quiet"
  uint32 vad_aggressiveness = 8;    // WebRTC VAD 0..3
  bool has_earcons = 9;             // it can play the voice's short sounds (Earcon)
  bool has_aec = 10;                // it cancels its own echo (none does yet)
  string input_device = 11;         // computer: PortAudio input; empty: the system default
  string output_device = 12;        // computer: PortAudio output
}

message VoiceSettings {
  string stt = 1;                   // auto | mlx | faster-whisper
  string stt_model = 2;             // tiny ... large-v3, turbo
  string tts = 3;                   // auto | qwen | say | piper | espeak
  string tts_voice = 4;             // empty: the default for the engine (qwen: marvin)
  string language = 5;              // empty: auto; fr | en
  string default_language = 6;
  bool wake = 7;                    // wait for "Marvin"
  bool duplex = 8;                  // version 1 only: version 2 reads AudioDeviceProfile.duplex
  double echo_tail_s = 9;           // version 1 only: AudioDeviceProfile.echo_tail_s
  double follow_up_s = 10;
  double listen_window_s = 11;
  bool speculative_stt = 12;
  double end_silence_ms = 13;       // version 1: 0 is the default; version 2: the value
  bool chime = 14;                  // version 1: the sidecar's own listening chime; version 2: unused (Earcon)
  string input_device = 15;         // version 1 only: AudioDeviceProfile.input_device
  string output_device = 16;        // version 1 only
  // one thought, one question (docs/voice.md): version 1, unset means the sidecar's default; version 2: always set
  optional double continue_grace_s = 17;       // speech resuming this soon after a question, before its answer is heard, continues it; 0: never
  optional double end_silence_long_ms = 18;    // the end-of-question silence when the words so far announce more ("..., et"); 0: never longer
  // version 2: always sent
  double continue_join_s = 19;                 // a question interrupting the answer (barge-in, Talk now) this soon after the one it cut joins it; 0: never
  double speculate_after_s = 20;               // start recognition after this much silence inside an utterance
}

// Where the voice hears and speaks.
enum AudioRoute {
  AUDIO_ROUTE_UNSPECIFIED = 0;
  AUDIO_ROUTE_LOCAL = 1;            // the computer's microphone and speaker (inside the sidecar)
  AUDIO_ROUTE_ROBOT = 2;            // the robot's, relayed by the core (robot_mic, robot_speaker)
}

message AudioFrame {
  string device = 1;                // e.g. marvin-a1b2c3
  uint32 sample_index = 2;          // index of the first sample in its stream (wraps)
  uint64 robot_time_us = 3;         // robot clock of the first sample (the UDP header's clock)
  bytes pcm = 4;                    // int16 little-endian, 320 samples (20 ms) from the robot
}

message ReplyStart {
  uint64 reply_id = 1;              // chosen by the core, unique in the session
  string language = 2;              // the language to speak it in
  bool proactive = 3;               // Marvin speaks on its own (not an answer)
  uint64 utterance_uid = 4;         // the utterance it answers (Heard.uid), 0 if none
}

message TextPiece {
  uint64 reply_id = 1;
  string text = 2;                  // version 1: the answer's text as the model streams it, which the sidecar
                                    // splits into sentences. Version 2 (clause = true): one clause, cut and
                                    // cleaned for speech by the core, spoken as it is
  string language = 3;              // version 2: the clause's language (fr | en), tagged by the core
  bool clause = 4;                  // version 2: always true
}

// One piece of speech in one language (version 2).
message Clause {
  string text = 1;
  string language = 2;
}

message ReplyEnd {
  uint64 reply_id = 1;
  string error = 2;                 // not empty: the answer failed ("llm_down" or "error"); if nothing
                                    // was said, the sidecar says a short sentence for it
}

message Say {
  uint64 reply_id = 1;
  string text = 2;
  string language = 3;
  bool force = 4;                   // speak even while muted or in quiet hours
  bool proactive = 5;
  repeated Clause clauses = 6;      // version 2: `text` cut and tagged by the core, spoken in this order
}

message ListenNow {
  bool on = 1;                      // false: stop listening
}

message Mute {
  bool muted = 1;
}

message StopSpeaking {
}

message Filler {
  uint64 reply_id = 1;
  string text = 2;
  string language = 3;
}

// A short sound on the voice's device: the computer's speaker plays the sidecar's own tones, a robot its
// built-in SOUND. The microphone ignores it (it never starts an utterance), and it never interrupts speech.
message Earcon {
  string sound = 1;                 // wake (listening opens), done (it closes), error
}

// A question typed in the app: the sidecar stops what it says, then treats it as heard, in
// `language` (empty: the forced language, else guessed from the text, else the conversation's).
message Ask {
  string text = 1;
  string language = 2;
}

message RobotLink {
  string device = 1;
  bool connected = 2;
  bool has_audio = 3;               // HELLO flag bit 2
}

// ============================================================================ sidecar -> core

message VoiceToCore {
  oneof m {
    Status status = 1;
    Heard heard = 2;                // a question for Marvin: the core answers it
    Ignored ignored = 3;            // heard, not answered, and why
    Level level = 4;                // microphone loudness, ~16 per second
    Partial partial = 5;            // the words understood so far
    SpeakerFrame robot_speaker = 6; // PCM for the robot, already paced (150 ms lead)
    RobotAudioCtrl ctrl = 7;        // AUDIO_CTRL for the robot (mic start every second, stop, volume)
    SayProgress say = 8;            // a piece of speech is queued on the speaker, after the previous ones
    Interrupted interrupted = 9;    // speech stopped early (barge-in, Stop)
    RobotSound sound = 10;          // SOUND for the robot (earcons)
    Utterance utterance = 11;       // someone started / stopped talking
    ReplySpoken spoken = 12;        // an answer has been said entirely, with its timings
  }
}

message Status {
  enum State {
    STATE_UNSPECIFIED = 0;
    STARTING = 1;
    IDLE = 2;                       // waiting for "Marvin"
    LISTENING = 3;
    THINKING = 4;
    SPEAKING = 5;
    STOPPED = 6;
    ERROR = 7;
  }
  State state = 1;
  bool muted = 2;
  string error = 3;                 // with ERROR: what is wrong
  string fix = 4;                   // with ERROR: how to fix it, one line
  string stt = 5;                   // the backends actually in use, e.g. "mlx large-v3-turbo"
  string tts = 6;
  optional double listen_s = 7;     // with LISTENING: seconds left in the listening window, when sent
  bool hearing = 8;                 // someone is talking (or their words are being understood): the listening
                                    // window waits, listen_s is not sent; a Status follows when they are done
  bool asked = 9;                   // with LISTENING: the window was asked for (Talk now, "Marvin." alone), not the
                                    // follow-up window after an answer
  string device = 10;               // the device it hears and speaks with: computer, or the robot's name
}

message Heard {
  uint64 uid = 1;                   // the question's id, unique in the session (not Utterance.uid)
  string text = 2;                  // the question, without "Marvin,"
  string raw = 3;                   // the full transcript, when it differs
  string language = 4;              // the language to answer in
  string source = 5;                // voice | typed
  map<string, double> latency = 6;  // endpoint, queue, stt, wake ... (seconds)
  double wall_time = 7;             // Unix seconds, when the question ended
  repeated uint64 continues = 8;    // earlier questions (their Heard.uid) this one continues: their text starts
                                    // `text`; they were cancelled (Interrupted "merged" before their answer was
                                    // heard, or "barge-in" when this one cut it); the core answers this one only
}

message Ignored {
  string text = 1;
  string reason = 2;                // e.g. "own voice", "too quiet", "conversation closed: ..."
  optional double dbfs = 3;
}

message Level {
  double mic = 1;                   // 0..1 (-60..-10 dBFS)
  bool speech = 2;
  bool gated = 3;
}

message Partial {
  uint64 uid = 1;                   // Utterance.uid
  string text = 2;
}

message Utterance {
  enum State {
    STATE_UNSPECIFIED = 0;
    START = 1;
    END = 2;
    DONE = 3;
  }
  State state = 1;
  uint64 uid = 2;
}

message SpeakerFrame {
  string device = 1;
  uint32 stream = 2;                // AUDIO_OUT stream id (u16)
  uint32 sample_index = 3;
  bytes pcm = 4;                    // int16 little-endian, 1..480 samples
}

message RobotAudioCtrl {
  string device = 1;
  uint32 command = 2;               // docs/protocol.md: 1 mic start, 2 mic stop, 3 play stop, 4 volume, 5 mic gain
  uint32 argument = 3;
}

message RobotSound {
  string device = 1;
  uint32 id = 2;                    // 1 chirp, 2 beep, 3 wake, 4 done, 5 error, 6 hello
}

message SayProgress {
  uint64 reply_id = 1;
  string text = 2;                  // the piece being said
  double seconds = 3;               // its duration
  repeated float envelope = 4;      // loudness, 20 values per second, 0..1
}

message Interrupted {
  uint64 reply_id = 1;              // 0 if the answer had not started yet
  string reason = 2;                // barge-in | stop | busy (proactive speech during a conversation) | merged
                                    // (the question goes on: a Heard that continues it follows)
  uint64 utterance_uid = 3;         // the question it answered (Heard.uid), 0 if none
}

message ReplySpoken {
  uint64 reply_id = 1;
  map<string, double> latency = 2;  // first_chunk, tts, first_audio (its first sound synthesised),
                                    // audio_start (queued on the speaker), playback_start (heard),
                                    // filler_start, total (seconds, measured from the end of the question
                                    // for first_audio, audio_start, playback_start and total)
  bool interrupted = 3;
  string text = 4;                  // what was actually said, cleaned for speech
  uint64 utterance_uid = 5;         // the question it answered (Heard.uid), 0 if none
}

// ============================================================================ batch and options

message AudioClip {
  bytes pcm = 1;                    // 16 kHz mono int16 little-endian
  string language = 2;              // empty: detect
}

message Transcript {
  string text = 1;
  string language = 2;
  double language_prob = 3;
  double no_speech_prob = 4;
  double avg_logprob = 5;
  double compression_ratio = 6;
  double seconds = 7;               // how long recognition took
  string rejected = 8;              // not empty: why it is not trusted
}

message OptionsRequest {
}

message VoiceOptions {
  repeated Backend stt = 1;
  repeated string stt_models = 2;
  repeated Backend tts = 3;
  repeated VoiceChoice voices = 4;
  repeated string languages = 5;    // fr, en
}

message Backend {
  string name = 1;
  bool installed = 2;
  string why = 3;                   // when not installed: what is missing
}

message VoiceChoice {
  string id = 1;                    // e.g. fr_FR-siwis-medium, or a macOS voice name
  string engine = 2;                // piper | say | espeak | qwen
  string language = 3;
  bool installed = 4;
  string locale = 5;                // e.g. fr_FR (macOS voices), empty when unknown
}
