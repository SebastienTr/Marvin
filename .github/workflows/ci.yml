# SPDX-License-Identifier: MIT
# The host (Python and Java, with the Testcontainers ITs really run), the docs lint, and the app end to end in
# demo mode. The firmware has its own workflow (firmware.yml), the CAD too (cad.yml).
name: CI

on:
  push:
    paths-ignore: ["hardware/**", ".github/workflows/cad.yml", ".github/workflows/firmware.yml"]
  pull_request:
    paths-ignore: ["hardware/**", ".github/workflows/cad.yml", ".github/workflows/firmware.yml"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: host/pyproject.toml
      - name: Install
        run: pip install -e "host[dev]"
      - name: Tests
        working-directory: host
        run: python -m pytest -q
      - name: Tools tests (doc lint, report, CI checks)
        run: python -m pytest -q tools/tests
      - name: Golden files are up to date
        # the generated contract files are made again from the Python host; any change must be committed on
        # purpose. Compressed files (.gz, .png) depend on the zlib version: compare the rest.
        run: |
          python host-java/marvin-contracts/tools/generate_all.py
          git diff --stat --exit-code -- 'host-java/marvin-contracts/golden/*.json' 'host-java/marvin-contracts/golden/*.jsonl'

  doclint:
    name: Doc lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The docs say what the code does (contract C9)
        run: python tools/doclint.py

  java:
    name: Java host
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-python@v5
        # the Python host runs beside the Java one in the tests: the simulator, the demo's past week,
        # the recording reader, the voice sidecar in its test mode
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: host/pyproject.toml
      - name: Python host for the tests (with the voice sidecar's gRPC)
        run: pip install -e "host[sidecar]"
      - name: Docker is here (the Testcontainers ITs need it)
        run: docker info --format 'Docker {{.ServerVersion}}, {{.NCPU}} CPUs, {{.MemTotal}} bytes'
      - name: Build and test (unit, ArchUnit, Testcontainers ITs, API contract)
        working-directory: host-java
        run: ./mvnw -B -ntp verify
      - name: The ITs really ran (none skipped for want of Docker or Python)
        if: always()
        run: python tools/ci/check_its.py host-java --min 8
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            host-java/**/target/surefire-reports/
            host-java/**/target/failsafe-reports/
          retention-days: 7
      - name: Launcher
        run: |
          sh -n marvin
          ./marvin doctor || true
          ./marvin report --no-doctor

  e2e:
    name: App end to end (demo mode)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MARVIN_DATA_DIR: ${{ github.workspace }}/.e2e-data
      MARVIN_VOICE_ARGS: --fake
      BASE: http://localhost:8765
      OUT: e2e-shots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: host/pyproject.toml
      - name: Python host (the demo's simulated robot and week, the voice sidecar's test mode) and Playwright
        run: |
          pip install -e "host[sidecar]" playwright
          python -m playwright install --with-deps chromium
      - name: Build the host
        working-directory: host-java
        run: ./mvnw -B -ntp -q -DskipTests package
      - name: A stand-in for Ollama
        run: |
          python host-java/e2e/stub_ollama.py 11434 "$RUNNER_TEMP/stub.log" > "$RUNNER_TEMP/stub.out" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
      - name: Start the demo
        run: ./marvin demo
      - name: Walk through the app (Playwright)
        env:
          STUB_LOG: ${{ runner.temp }}/stub.log
        run: python host-java/e2e/e2e.py demo
      - name: The report a user would paste
        if: always()
        run: ./marvin report --no-doctor
      - name: Logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            e2e-shots/
            .e2e-data/logs/
            ${{ runner.temp }}/stub.*
          retention-days: 7
      - name: Stop
        if: always()
        run: ./marvin down || true
